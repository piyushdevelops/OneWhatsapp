<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OneOperations WhatsApp Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <div class="brand-mark">TJS</div>
          <div>
            <div class="brand-name">OneOperations</div>
            <div class="brand-subtitle">WhatsApp OS</div>
          </div>
        </div>

        <nav class="nav-list">
          <button class="nav-item active" data-screen="dashboard">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 17V9m5 8V6m5 11v-5"/></svg>
            </span>
            <span>Command Center</span>
          </button>
          <button class="nav-item" data-screen="audience">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 21a6 6 0 0 1 12 0m2 0a5 5 0 0 1 6-4.9"/></svg>
            </span>
            <span>Customers</span>
          </button>
          <button class="nav-item" data-screen="broadcasts">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m4 13 11-7v16L4 15H2v-4h2Zm15-5a6 6 0 0 1 0 10"/></svg>
            </span>
            <span>Campaigns</span>
          </button>
          <button class="nav-item" data-screen="templates">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>
            </span>
            <span>Templates</span>
          </button>
          <button class="nav-item" data-screen="journeys">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 5a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM6 7h6a4 4 0 0 1 4 4v4M9 7l3-3m0 6L9 7"/></svg>
            </span>
            <span>Automations</span>
          </button>
          <button class="nav-item" data-screen="inbox">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 4V5Zm4 5h8m-8 4h5"/></svg>
            </span>
            <span>Inbox</span>
            <span class="nav-pill" id="inbox-count-pill">0</span>
          </button>
          <button class="nav-item" data-screen="bot">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 5V2m-6 8h12a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-5a3 3 0 0 1 3-3Zm3 5h.01M15 15h.01M8 3h8"/></svg>
            </span>
            <span>Studio</span>
          </button>
          <button class="nav-item" data-screen="settings">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0-6v3m0 14v3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17m10-10 2.1-2.1"/></svg>
            </span>
            <span>Settings</span>
          </button>
        </nav>

        <div class="account-row">
          <div class="account-avatar">TJS</div>
          <div>
            <div class="account-name">The June Shop</div>
            <div class="account-role">Admin workspace</div>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <h1 id="page-title">Command Center</h1>
            <p id="page-subtitle">What needs attention, what is making money, and what to do next.</p>
          </div>
          <div class="topbar-actions" id="topbar-actions"></div>
        </header>
        <section id="screen" class="screen" aria-live="polite"></section>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
